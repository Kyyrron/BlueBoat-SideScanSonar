[package]
name = "blueboat-hub"
version = "0.1.0"
description = "BlueBoat Hub: launcher, terminal and build panel for the BlueBoat project"
edition = "2021"
publish = false

[lib]
name = "blueboat_hub_lib"
crate-type = ["rlib"]

[[bin]]
name = "blueboat-hub"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
x11rb = "0.13"
notify = "8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.dev]
debug = 0
incremental = true

[profile.release]
codegen-units = 4
lto = "thin"
strip = true
opt-level = "s"
