# tmux configuration of the hub's private server (`tmux -L blueboat-hub`).
# Read only when the hub starts that server; your own ~/.tmux.conf and
# default tmux server are never touched.

# keep a crashed app's last output readable; the hub shows "exited (code N)"
set -g remain-on-exit on
set -g history-limit 50000
set -g status off
set -g escape-time 0
set -g default-terminal "tmux-256color"
# the hub's control client sets the size of the session it shows
set -g window-size latest
set -g allow-rename off
set -g mouse off
# the line tmux writes under a finished app's output (default: "Pane is dead …")
set -g remain-on-exit-format "#[dim]── ended #{t/p:pane_dead_time} ──"
